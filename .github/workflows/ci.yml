name: FlyTech build checks

on:
  push:
    branches: [main, build/real-efb-platform, "refresh/**"]
  pull_request:
    branches: [main, build/real-efb-platform]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/db.js
      - name: Build web app
        run: npm run build
