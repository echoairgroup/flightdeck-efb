services:
  - type: web
    name: flightdeck-efb
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SIMBRIEF_USER_ID
        sync: false
      - key: VATSIM_CLIENT_ID
        sync: false
      - key: VATSIM_CLIENT_SECRET
        sync: false
      - key: VATSIM_REDIRECT_URI
        sync: false
