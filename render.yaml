services:
  - type: web
    name: flightdeck-efb
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AIRPORTDB_TOKEN
        sync: false
